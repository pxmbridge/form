<form class="request-form" id="lead-form">

  <input 
    type="text" 
    class="request-input"
    name="name"
    placeholder="Ваше имя"
    required
  >

  <input 
    type="tel" 
    class="request-input"
    name="phone"
    placeholder="Телефон"
    required
  >

  <input 
    type="email" 
    class="request-input"
    name="email"
    placeholder="E-mail"
    required
  >

  <button type="submit" class="request-button">
    Отправить
  </button>

</form>

<!-- Сообщение -->
<div id="success-message" style="
  display:none;
  margin-top:20px;
  font-family:Roboto,sans-serif;
  font-size:16px;
  color:#000000;
  text-align:center;
">
  Спасибо! Заявка отправлена.
</div>

<script>
  const form = document.getElementById('lead-form');

  form.addEventListener('submit', async function(e) {

    e.preventDefault();

    const formData = {
      name: form.name.value,
      phone: form.phone.value,
      email: form.email.value
    };

    try {

      const response = await fetch(
        'https://chatter.salebot.pro/api/51e366a75a6fc954161fbf95142bd2ab',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        }
      );

      if (response.ok) {

        document.getElementById('success-message').style.display = 'block';

        form.reset();

      } else {

        alert('Ошибка отправки формы');

      }

    } catch(error) {

      alert('Ошибка соединения');

      console.error(error);

    }

  });
</script>
